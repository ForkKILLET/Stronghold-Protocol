name: CI

# This fork deploys main. PR branches are checked through pull_request, not again on push.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also run Windows / Node 22 and the Node 24 guards
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build and smoke once. All test shards consume this run's immutable client artifact.
  tooling:
    name: checks (build, smoke, lint, imports, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund
      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local
      - name: Build production client
        run: npm run build

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

      - name: Lint (warnings allowed)
        run: npm run lint
      - name: Import boundaries
        run: npm run check:imports
      - name: Typecheck
        run: npm run typecheck
      - uses: actions/upload-artifact@v7
        with:
          name: production-client
          path: public/build/
          if-no-files-found: error
          retention-days: 1

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    needs: tooling
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]
        shard: [0, 1, 2, 3]
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: production-client
          path: public/build/
      - name: Unit & integration tests
        run: npm run test

  # These lanes are opt-in at dispatch; normal pushes / PRs run six jobs in total.
  node24:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    name: node 24 (CI guards, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund
      - name: CI guard tests (Node 24)
        run: npm run test:guards

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    name: compatibility (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    needs: tooling
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22]
        shard: [0, 1, 2, 3]
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: production-client
          path: public/build/
      - name: Windows compatibility tests
        run: npm run test

  # Independent full comparison, with the original corpus and no automatic updates.
  golden:
    name: golden (full corpus, ubuntu, node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Full Golden regression check
        run: npm run golden
