name: Windows portability diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Runtime and archive tools
        shell: pwsh
        run: |
          node --version
          Get-Command tar,zip -ErrorAction SilentlyContinue | Format-List Name,Source
          tar --version
      - name: Windows regression suites
        run: node --test test/server-runtime-config.test.js test/users/profile-debug.test.js test/users/public-profiles.test.js test/update-package.test.js
