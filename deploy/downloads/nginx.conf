worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_conn_zone $server_name zone=downloads:32k;
  gzip on;
  gzip_types text/css application/javascript application/json;
  server {
    listen 8080;
    root /srv;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location = /downloads { return 308 /downloads/; }
    location = /downloads/healthz { default_type text/plain; return 200 'ok'; }
    location = /downloads/downloads.json {
      alias /srv/bundles/downloads.json;
      add_header Cache-Control 'no-cache';
    }
    location = /downloads/SHA256SUMS {
      alias /srv/bundles/SHA256SUMS;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }
    location ^~ /downloads/files/ {
      alias /srv/bundles/files/;
      autoindex off;
      limit_conn downloads __CONNECTIONS__;
      limit_conn_status 429;
      limit_rate __RATE__;
      max_ranges 1;
      add_header Cache-Control 'public, max-age=31536000, immutable';
      add_header Content-Disposition attachment;
      add_header Access-Control-Allow-Origin '*';
      add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Accept-Ranges, ETag';
    }
    location /downloads/ {
      index index.html;
      try_files $uri $uri/ =404;
      add_header Cache-Control 'no-cache';
    }
    location / { return 404; }
  }
}
